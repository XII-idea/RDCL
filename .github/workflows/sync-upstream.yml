# RDCL 上游同步与构建 —— 规划 §3.1 / §3.2
#
# 三种触发方式，逻辑完全一致（都是「抓上游最新 tag → 幂等判断 → 构建发布」）：
#   1. push 到 main（仅 patches/scripts/assets/workflow 变更时）→ 立即抓最新 tag 构建
#   2. schedule 每 8 小时 → 兜底巡检
#   3. workflow_dispatch（可勾选 force 跳过幂等，用于补丁修复后重出同一 tag）
#
# 幂等判据：本仓库 tag `rdcl/<上游tag>` 是否存在（rdcl-state.json 仅作审计记录）。

name: Sync Upstream & Build RDCL

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/sync-upstream.yml'
      # 注意：刻意不含 rdcl-state.json —— 避免 CI 回写状态再次触发本 workflow
  schedule:
    # 每 8 小时（UTC 00:23/08:23/16:23 ≈ 北京时间 08:23/16:23/00:23）
    # 刻意避开整点，减少 GitHub schedule 排队延迟
    - cron: '23 */8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建当前最新 tag（忽略已存在的 rdcl/<tag>）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  detect:
    name: 检测上游最新 tag
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.check.outputs.has_new }}
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
      build_number: ${{ steps.check.outputs.build_number }}
      upstream_prerelease: ${{ steps.check.outputs.upstream_prerelease }}
      status_synced: ${{ steps.check.outputs.status_synced }}
      fingerprint: ${{ steps.check.outputs.fingerprint }}
    steps:
      - name: Checkout RDCL
        uses: actions/checkout@v6
        with:
          fetch-depth: 0          # 需要本仓库 tags 做幂等判断
          fetch-tags: true

      - name: 抓取上游最新 tag 并做幂等判断
        id: check
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 1. 上游最新 tag（按版本号排序取最大，兼容 v3.17.0.362 与未来 v3.18.x）
          UPSTREAM_TAG=$(git ls-remote --tags --refs https://github.com/HMCL-dev/HMCL.git \
            | awk '{print $2}' | sed 's|refs/tags/||' | grep -E '^v[0-9]' | sort -V | tail -n 1)

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::error::未能获取上游任何 tag"
            exit 1
          fi

          # 2. 该 tag 指向的 commit（兼容轻量 tag 与附注 tag）
          UPSTREAM_COMMIT=$(git ls-remote https://github.com/HMCL-dev/HMCL.git \
            "refs/tags/${UPSTREAM_TAG}" "refs/tags/${UPSTREAM_TAG}^{}" \
            | awk '$2 !~ /\^\{\}$/ {print $1; exit}')

          # 3. 上游该 release 的 prerelease 状态
          #    （上游行为：正式版刚发布时也标 prerelease，随后转为 release）
          #    未知/无 release 时保守按 prerelease 处理
          UPSTREAM_PRE="true"
          if PRE=$(gh api "repos/HMCL-dev/HMCL/releases/tags/${UPSTREAM_TAG}" --jq '.prerelease' 2>/dev/null); then
            UPSTREAM_PRE="$PRE"
          fi

          # 4. 内容指纹 —— 决定产物内容的部分（补丁 + 脚本 + 素材）
          #    这样「上游 tag 没变但补丁/脚本改了」也会触发重建（+n），
          #    而仅改 workflow / 文档不会重建产物
          FINGERPRINT=$(
            {
              cat patches/[0-9][0-9][0-9][0-9]-*.patch 2>/dev/null || true
              cat scripts/*.py 2>/dev/null || true
              find assets -type f -exec cat {} + 2>/dev/null || true
            } | sha256sum | cut -d' ' -f1
          )
          STORED_FP=$(jq -r '.build_fingerprint // ""' rdcl-state.json 2>/dev/null || echo "")

          # 5. 幂等判据一：本仓库是否已有 rdcl/<tag>
          EXISTING=$(git ls-remote --tags --refs origin "refs/tags/rdcl/${UPSTREAM_TAG}" | wc -l)

          # 6. 构建次数（rdcl-state.json 的 build_count[tag]，缺省 0）
          PREV=$(jq -r --arg t "$UPSTREAM_TAG" '.build_count[$t] // 0' rdcl-state.json 2>/dev/null || echo 0)
          BUILD_NUMBER=$(( PREV + 1 ))

          # 7. 幂等判据二：tag 未变时，比对内容指纹
          HAS_NEW=true
          SKIP_REASON=""
          if [ "$EXISTING" -gt 0 ] && [ "${FORCE:-false}" != "true" ]; then
            if [ "$STORED_FP" = "$FINGERPRINT" ]; then
              HAS_NEW=false
              SKIP_REASON="tag 与内容指纹均未变化"
            else
              SKIP_REASON="tag 已构建，但内容指纹变化（补丁/脚本/素材已更新）→ 重新构建 +${BUILD_NUMBER}"
            fi
          fi
          echo "内容指纹 = ${FINGERPRINT}（上次构建记录 = ${STORED_FP:-<无>}）"
          [ -n "$SKIP_REASON" ] && echo "跳过判断：${SKIP_REASON}"

          # 8. prerelease 状态同步：上游已转正、而我们仍是 prerelease → 同步转正
          #    （不重新构建，只改 release 标记；下次巡检内生效，最多延迟 8 小时）
          STATUS_SYNCED=false
          if [ "$HAS_NEW" = "false" ]; then
            OUR_PRE="unknown"
            if OP=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/rdcl/${UPSTREAM_TAG}" --jq '.prerelease' 2>/dev/null); then
              OUR_PRE="$OP"
            fi
            if [ "$UPSTREAM_PRE" = "false" ] && [ "$OUR_PRE" = "true" ]; then
              if gh release edit "rdcl/${UPSTREAM_TAG}" --prerelease=false; then
                STATUS_SYNCED=true
                echo "已同步：上游 ${UPSTREAM_TAG} 已转为正式版，本仓库对应 release 同步转正。"
              else
                echo "::warning::同步 release 状态失败（不影响构建）"
              fi
            else
              echo "release 状态无需同步（上游=${UPSTREAM_PRE}，本仓库=${OUR_PRE}）"
            fi
          fi

          {
            echo "has_new=${HAS_NEW}"
            echo "tag=${UPSTREAM_TAG}"
            echo "commit=${UPSTREAM_COMMIT}"
            echo "build_number=${BUILD_NUMBER}"
            echo "upstream_prerelease=${UPSTREAM_PRE}"
            echo "status_synced=${STATUS_SYNCED}"
            echo "fingerprint=${FINGERPRINT}"
          } >> "$GITHUB_OUTPUT"

          echo "上游最新 tag = ${UPSTREAM_TAG}（${UPSTREAM_COMMIT}），构建号 +${BUILD_NUMBER}，上游 prerelease=${UPSTREAM_PRE}，has_new=${HAS_NEW}"

  build:
    name: 构建并发布 RDCL
    needs: detect
    if: needs.detect.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.tag }}
      UPSTREAM_COMMIT: ${{ needs.detect.outputs.commit }}
      BUILD_NUMBER: ${{ needs.detect.outputs.build_number }}
      UPSTREAM_PRERELEASE: ${{ needs.detect.outputs.upstream_prerelease }}
      BUILD_FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}
    steps:
      - name: Checkout 上游 tag 源码
        uses: actions/checkout@v6
        with:
          repository: HMCL-dev/HMCL
          ref: ${{ needs.detect.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Checkout RDCL（补丁/脚本/素材）
        uses: actions/checkout@v6
        with:
          path: rdcl

      - name: Set up JDK 17（含 JavaFX，与上游 CI 一致）
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      # ---------- 步骤 4：应用补丁（§3.2 步骤4） ----------
      - name: 应用补丁 patches/000*.patch
        working-directory: upstream
        run: |
          set -euo pipefail
          for p in "$GITHUB_WORKSPACE"/rdcl/patches/[0-9][0-9][0-9][0-9]-*.patch; do
            echo "::group::git apply $(basename "$p")"
            git apply --3way "$p"
            echo "::endgroup::"
          done

      - name: 地区限制中和（scripts/neutralize_region.py）
        working-directory: upstream
        run: |
          python3 "$GITHUB_WORKSPACE/rdcl/scripts/neutralize_region.py" \
            HMCL/src/main/java/org/jackhuang/hmcl/util/RegionUtils.java

      - name: 移除设置页更新区块（scripts/strip_update_ui.py）
        working-directory: upstream
        run: |
          python3 "$GITHUB_WORKSPACE/rdcl/scripts/strip_update_ui.py" \
            HMCL/src/main/java/org/jackhuang/hmcl/ui/main/SettingsPage.java

      # ---------- 步骤 5：品牌替换（§5） ----------
      - name: 品牌替换（rebrand R1/R2/R3）
        run: python3 rdcl/scripts/rebrand.py upstream

      # ---------- 步骤 6：素材覆盖（§6） ----------
      - name: 覆盖 RDCL 素材（占位期为空，自动跳过）
        run: |
          set -euo pipefail
          IMG=upstream/HMCL/src/main/resources/assets/img
          if [ -d rdcl/assets/rdcl/icon ] && [ -n "$(ls -A rdcl/assets/rdcl/icon 2>/dev/null)" ]; then
            cp -v rdcl/assets/rdcl/icon/* "$IMG"/
          else
            echo "assets/rdcl/icon 为空（占位期）—— 使用上游原图"
          fi
          if [ -f rdcl/assets/rdcl/image/hmcl.png ]; then
            cp -v rdcl/assets/rdcl/image/hmcl.png upstream/HMCL/image/hmcl.png
          fi

      # ---------- 步骤 7：构建（§3.2 步骤7） ----------
      - name: 构建
        working-directory: upstream
        env:
          RDCL_UPSTREAM_TAG: ${{ needs.detect.outputs.tag }}
          RDCL_BUILD_NUMBER: ${{ needs.detect.outputs.build_number }}
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          # 可选 secrets：缺省时对应功能自动降级（微软登录/部分下载源）
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel

      # ---------- 步骤 8：产物校验（§3.2 步骤8、§5.4） ----------
      - name: 品牌残留门禁
        run: python3 rdcl/scripts/check_branding.py upstream

      - name: 产物结构冒烟
        run: |
          set -euo pipefail
          ls -la upstream/HMCL/build/libs/
          # 不可直接 java -jar（JavaFX GUI），改为 zip 结构 + manifest 校验
          JAR=$(ls upstream/HMCL/build/libs/RDCL-*.jar | head -n 1)
          unzip -t "$JAR" > /dev/null
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -E 'Main-Class|Implementation-Version'
          echo "版本号: ${UPSTREAM_TAG}-rdcl+${BUILD_NUMBER}"

      # ---------- 步骤 9：源码包 + 发布（§3.5、§3.2 步骤9） ----------
      - name: 打包对应源码（GPLv3 §5/§6 对应源码义务）
        run: |
          set -euo pipefail
          tar -czf "RDCL-${UPSTREAM_TAG}-source.tar.gz" \
            -C upstream \
            --exclude='.git' --exclude='.gradle' \
            --exclude='*/build' --exclude='*/out' --exclude='*/.idea' \
            .

      - name: 创建 tag 与 GitHub Release
        # 注意：两个 checkout 都在子目录（upstream/ 与 rdcl/），根目录不是 git 仓库，
        # gh 需要在本仓库检出目录中执行，否则报 "not a git repository"
        working-directory: rdcl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 资产在上游源码树里，用绝对路径（当前工作目录是 rdcl/）
          LIBS="$GITHUB_WORKSPACE/upstream/HMCL/build/libs"
          ls -la "$LIBS"

          cat > /tmp/rdcl-notes.md <<EOF
          RDCL 构建自上游 HMCL \`${UPSTREAM_TAG}\`（commit \`${UPSTREAM_COMMIT}\`），第 ${BUILD_NUMBER} 次构建。

          **与上游的差异**：移除中国大陆游戏下载限制 · 品牌改名 RDCL / Ray Dust Craft Launcher · 反馈渠道指向本仓库 Issues · 屏蔽上游自动更新 · 屏蔽帮助页远程目录。

          | 产物 | 说明 |
          | --- | --- |
          | \`RDCL-*\` 含 jar / exe / sh / deb | 各平台启动器（附 sha1/sha256/sha512） |
          | \`RDCL-${UPSTREAM_TAG}-source.tar.gz\` | **与二进制一一对应的完整源码**（GPLv3 §5） |

          **关于本 release**：tag 与 release 名固定为 \`rdcl/${UPSTREAM_TAG}\`，与构建次数无关；同一上游版本的**多次重建会覆盖本 release 的资产与标题**（如 +1 → +5），始终以最后一次构建为准。上游正式版转为 release 时，本 release 会自动同步转正。

          **许可证**：HMCL 派生部分 GPLv3 + 上游附加条款；RDCL 自有代码 AGPLv3；自有文档与图片 CC BY-NC-SA 4.0。详见仓库 \`LICENSE\`。
          EOF
          # 上游该 tag 当时是 prerelease → 我们也标 prerelease；已转正 → 发正式 release
          # （上游正式版会先标 prerelease 再转正，转正同步由 detect 步骤 6 负责）
          PRERELEASE_FLAG="--prerelease"
          if [ "${UPSTREAM_PRERELEASE:-true}" = "false" ]; then
            PRERELEASE_FLAG=""
          fi

          RELEASE_TAG="rdcl/${UPSTREAM_TAG}"
          TITLE="RDCL ${UPSTREAM_TAG}+${BUILD_NUMBER}"
          ASSETS=(
            "$LIBS"/RDCL-*.jar "$LIBS"/RDCL-*.exe "$LIBS"/RDCL-*.sh "$LIBS"/RDCL-*.deb
            "$LIBS"/RDCL-*.sha1 "$LIBS"/RDCL-*.sha256 "$LIBS"/RDCL-*.sha512
            "$GITHUB_WORKSPACE/RDCL-${UPSTREAM_TAG}-source.tar.gz"
          )

          # tag 与 release 名与 +n 无关（始终 rdcl/<tag>），因此同一 tag 的多次构建
          # 会命中「已存在」—— 此时覆盖资产并更新标题，而不是创建失败
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "release ${RELEASE_TAG} 已存在 —— 第 ${BUILD_NUMBER} 次构建：覆盖资产 + 更新标题"
            gh release upload "$RELEASE_TAG" --clobber "${ASSETS[@]}"
            gh release edit "$RELEASE_TAG" \
              --title "$TITLE" \
              --notes-file /tmp/rdcl-notes.md \
              --prerelease="${UPSTREAM_PRERELEASE:-true}"
          else
            gh release create "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file /tmp/rdcl-notes.md \
              $PRERELEASE_FLAG
          fi

      # ---------- 步骤 10：回写状态（§3.2 步骤10） ----------
      - name: 回写 rdcl-state.json
        working-directory: rdcl
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq --arg tag "$UPSTREAM_TAG" \
             --arg commit "$UPSTREAM_COMMIT" \
             --arg now "$NOW" \
             --argjson n "$BUILD_NUMBER" \
             --arg fp "$BUILD_FINGERPRINT" \
             '.last_built_tag=$tag | .last_built_commit=$commit | .last_built_at=$now
              | .build_count[$tag]=$n | .build_fingerprint=$fp' rdcl-state.json > rdcl-state.json.tmp
          mv rdcl-state.json.tmp rdcl-state.json
          cat rdcl-state.json

      - name: 提交状态（[skip ci] 避免自我触发）
        working-directory: rdcl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rdcl-state.json
          if git diff --cached --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore(ci): 记录 ${UPSTREAM_TAG}+${BUILD_NUMBER} 构建状态 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
